<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - MercadoFIPP</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand" href="index.html">MercadoFIPP</a>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center">Cadastro de Usuário</h2>
        <form id="registerForm" class="mt-4">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" class="form-control" id="username" placeholder="Digite seu nome de usuário" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirme sua senha" required>
            </div>
            <div class="form-group">
                <label for="accessLevel">Nível de Acesso</label>
                <select class="form-control" id="accessLevel" required>
                    <option value="c">Cliente</option>
                    <option value="v">Vendedor</option>
                    <option value="a">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
        </form>
        <div id="successMessage" class="mt-3 text-success text-center" style="display: none;">Usuário cadastrado com sucesso!</div>
        <div id="errorMessage" class="mt-3 text-danger text-center" style="display: none;">Erro ao cadastrar o usuário.</div>
    </div>

    <script src="js/registroUser.js"></script>
</body>
</html>
