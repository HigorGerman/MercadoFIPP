<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Anúncio - MercadoFIPP</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand" href="index.html">MercadoFIPP</a>
    </nav>

    <div class="container mt-5">
        <h2>Cadastrar Anúncio</h2>
        <form onsubmit="cadastrarAnuncio(event)">
            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" class="form-control" id="titulo" placeholder="Título do Anúncio" required>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea class="form-control" id="descricao" rows="3" placeholder="Descrição do Produto" required></textarea>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select class="form-control" id="categoria" required>
                    <option value="1">Livros</option>
                    <option value="2">Computadores</option>
                    <option value="3">Acessórios</option>
                </select>
            </div>
            <div class="form-group">
                <label for="valor">Valor</label>
                <input type="number" class="form-control" id="valor" placeholder="Valor do Produto" required>
            </div>
            <div class="form-group">
                <label for="data">Data</label>
                <input type="date" class="form-control" id="data" required>
            </div>
            <div class="form-group">
                <label for="fotos">Fotos</label>
                <input type="file" class="form-control-file" id="fotos" multiple>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar Anúncio</button>
        </form>
    </div>

    <!-- Importação do Axios e do Script de Cadastro -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/CadastroAnuncio.js"></script> <!-- Script do Cadastro -->
</body>
</html>
