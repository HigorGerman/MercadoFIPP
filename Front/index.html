<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercadoFIPP - Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .product-card {
            width: 100%;
            max-width: 250px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .product-info {
            padding: 10px;
        }

        .product-price {
            font-weight: bold;
            color: #28a745;
        }

        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        table {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Navbar com links para Login e Cadastro e campo de busca centralizado -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand" href="index.html">MercadoFIPP</a>
        <form class="form-inline mx-auto" style="width: 400px;">
            <div class="input-group w-100">
                <div class="input-group-append">
                    
                </div>
            </div>
        </form>
        <div class="ml-auto">
            <a href="login.html" class="btn btn-outline-light mr-2">Login</a>
            <a href="cadastroUser.html" class="btn btn-outline-light">Cadastro</a>
            <a href="loginAdm.html" class="btn btn-outline-light">Administrativo</a>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Bem-vindo ao MercadoFIPP</h1>
            <a href="BuscaAnuncio.html" class="btn btn-outline-light">Buscar</a>
            <a href="CadastroAnuncio.html" class="btn btn-outline-light mr-2">Cadastrar Produto</a>
        </div>
        <p class="text-left">Compre e venda produtos novos ou usados!</p>

        <!-- Lista de Anúncios em Cards -->
        <h2 class="mt-5">Últimos Anúncios</h2>
        <div class="product-list" id="latest-ads">
            <!-- Os cards dos anúncios serão renderizados dinamicamente -->
        </div>

        <!-- Tabela com Detalhes dos Anúncios -->
        <h2 class="mt-5">Anúncios Detalhados</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody id="detailed-ads">
                <!-- Os anúncios detalhados serão renderizados dinamicamente -->
            </tbody>
        </table>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
