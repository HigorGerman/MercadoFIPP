<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercadoFIPP - Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    
    <div class="navbar">
        MercadoFIPP
    </div>

   
    <div class="container">
        <h1 class="text-center">Bem-vindo ao MercadoFIPP</h1>
        <p class="text-center">Compre e venda produtos novos ou usados!</p>

        
        <h2 class="mt-5">Últimos Anúncios</h2>
        <div class="row">
            
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="imagem.jpg" class="card-img-top" alt="Imagem do Produto">
                    <div class="card-body">
                        <h5 class="card-title">Título do Produto</h5>
                        <p class="card-text">Descrição breve do produto.</p>
                        <p class="card-text"><strong>R$ 00,00</strong></p>
                        <a href="#" class="btn btn-primary">Ver Anúncio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
