<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Anúncios - MercadoFIPP</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">MercadoFIPP</a>
    </nav>

    <!-- Formulário de Busca -->
    <div class="container mt-5">
        <h2>Buscar Anúncios</h2>
        <form class="form-inline mb-4">
            <input type="text" class="form-control mr-2" placeholder="Buscar...">
            <select class="form-control mr-2">
                <option>Categoria</option>
                <option>Livros</option>
                <option>Computadores</option>
                <option>Acessórios</option>
            </select>
            <select class="form-control mr-2">
                <option>Ordenar por</option>
                <option>Mais Recentes</option>
                <option>Menor Preço</option>
                <option>Maior Preço</option>
            </select>
            <button type="submit" class="btn btn-primary">Buscar</button>
        </form>

        <!-- Resultados da Busca -->
        <div class="row">
            <!-- Card para cada anúncio (exemplo estático) -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="imagem.jpg" class="card-img-top" alt="Imagem do Produto">
                    <div class="card-body">
                        <h5 class="card-title">Título do Produto</h5>
                        <p class="card-text">Descrição breve do produto.</p>
                        <p class="card-text"><strong>R$ 00,00</strong></p>
                        <a href="#" class="btn btn-primary">Ver Anúncio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
